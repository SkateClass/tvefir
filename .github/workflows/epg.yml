name: EFIR EPG and Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: efir-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing remote and website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download real EPG and build unchanged website with programme addon
        run: python tools/build_epg_site.py --root . --out _site
      - name: Save generated remote and programme for downloading
        uses: actions/upload-artifact@v4
        with:
          name: efir-tvpult-test-files
          retention-days: 3
          path: |
            _site/tvpult.html
            _site/tvpult-epg-test.html
            _site/epg.json
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
